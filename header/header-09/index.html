        <script>
            jQuery(document).ready(function($) {
                 $('.elementor-popup-modal .nice-select .list').css({
        'max-height': '200px',
        'overflow-y': 'auto'
    });
                // Define feeTable inside jQuery ready to avoid global scope conflicts
                const feeTable = {
                    'telkomsel': [
                        [5000, 19900, 1850],
                        [20000, 49900, 2500],
                        [50000, 99900, 3000],
                        [100000, 199900, 5000],
                        [200000, 299000, 7500],
                        [300000, 499000, 10500],
                        [500000, null, 14000],
                    ],
                    'im3': [
                        [1, 24999, 1000],
                        [25000, 49999, 1500],
                        [50000, 99999, 2000],
                        [100000, 200000, 4000],
                    ],
                    'three': [
                        [1000, 24999, 1000],
                        [25000, 49999, 1500],
                        [50000, 99999, 2000],
                        [100000, 200000, 4000],
                    ],
                    'axis': getAxisXlFees(),
                    'xl': getAxisXlFees(),
                    'smartfren': [
                        [1, 5000, 500],
                        [5001, 10000, 1000],
                        [10001, 20000, 1500],
                        [20001, 50000, 2000],
                        [50001, 100000, 2500],
                    ],
                };

                function getAxisXlFees() {
                    return [
                        [1000, 24999, 1500],
                        [25000, 49999, 2000],
                        [50000, 99999, 2500],
                        [100000, 199999, 4500],
                        [200000, 299999, 6500],
                        [300000, 499999, 8500],
                        [500000, 1000000, 10000],
                    ];
                }

                function checkFeePrice(price, type) {
                    type = type.toLowerCase();
                    if (!feeTable[type]) {
                        return 0;
                    }
                    return calculateFee(price, feeTable[type]);
                }

                function calculateFee(price, ranges) {
                    for (const [min, max, fee] of ranges) {
                        if (price >= min && (max === null || price <= max)) {
                            return fee;
                        }
                    }
                    return 0;
                }

                function calculateConvertedAmount(amount, rate) {
                    return amount * rate;
                }

                const form = $('#whatsapp-form-eb08cad');
                const modal = $('#confirmation-modal-eb08cad');
                const submitButton = form.find('.submit-button');

                // Handle button click
                submitButton.on('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    // Validate form fields
                    const inputs = form.find('input[required], select[required]');
                    let isValid = true;

                    inputs.each(function() {
                        if (!this.value) {
                            $(this).addClass('is-invalid');
                            isValid = false;
                        } else {
                            $(this).removeClass('is-invalid');
                        }
                    });

                    if (!isValid) return;

                    const provider = form.find('input[name="provider"]:checked');
                    if (!provider.length) {
                        alert('Silakan pilih provider terlebih dahulu');
                        return;
                    }
                    
                    const paymentMethod = form.find('select[name="payment"]');
                    const paymentValue = paymentMethod.val();
                    if (paymentValue === 'Pilih Metode Pembayaran') {
                        alert('Silakan pilih Metode Pembayaran terlebih dahulu');
                        return;
                    }

                    // Validate nominal
                    const nominal = parseInt(form.find('[name="nominal"]').val());
                    const min = parseInt(provider.data('min'));
                    const max = parseInt(provider.data('max'));

                    if (nominal < min || (max && nominal > max)) {
                        return;
                    }

                    // Update and show modal
                    updateModalContent();
                });

                // Update fungsi updateModalContent()
                function updateModalContent() {
                    const provider = form.find('input[name="provider"]:checked');
                    const providerName = provider.data('name');
                    const rate = parseFloat(provider.data('rate'));
                    const nominal = form.find('[name="nominal"]').val();
                    const phone = form.find('[name="phone"]').val();
                    const paymentText = form.find('[name="payment"] option:selected').text();
                    const accountName = form.find('[name="account_name"]').val();
                    const accountNumber = form.find('[name="account_number"]').val();

                    const fee = checkFeePrice(nominal, providerName.toLowerCase());
                    const total = calculateConvertedAmount(nominal, rate);

                    modal.find('.provider-name').text(providerName);
                    modal.find('.nominal-value').text(formatCurrency(nominal));
                    modal.find('.phone-value').text(phone);
                    modal.find('.payment-value').text(paymentText);
                    modal.find('.account-value').text(`${accountName} (${accountNumber})`);
                    modal.find('.fee-value').text(formatCurrency(fee));
                    modal.find('.total-value').text(formatCurrency(total));

                    // Tampilkan modal
                    modal.addClass('show');
                    modal.css('display', 'flex');
                    $('body').addClass('modal-open');
                }

                // Handle modal buttons
                modal.find('.modal-button.confirm').on('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const provider = form.find('input[name="provider"]:checked');
                    const providerName = provider.data('name');
                    const nominal = form.find('[name="nominal"]').val();
                    const phone = form.find('[name="phone"]').val();
                    const payment = form.find('[name="payment"] option:selected').text();
                    const accountName = form.find('[name="account_name"]').val();
                    const accountNumber = form.find('[name="account_number"]').val();
                    const fee = checkFeePrice(nominal, providerName.toLowerCase());
                    const total = calculateConvertedAmount(nominal, provider.data('rate'));

                    const message = encodeURIComponent(
                        `*Detail Pesanan Pulsa*\n` +
                        `Provider: ${providerName}\n` +
                        `Nominal: ${formatCurrency(nominal)}\n` +
                        `No. HP: ${phone}\n` +
                        `Metode Pembayaran: ${payment}\n` +
                        `Atas Nama: ${accountName}\n` +
                        `No. Rekening: ${accountNumber}\n` +
                        `Biaya Admin: ${formatCurrency(fee)}\n` +
                        `Total: ${formatCurrency(total)}`
                    );

                    const phoneWhatsApp = '';
                    const whatsappUrl = `https://wa.me/${phoneWhatsApp}?text=${message}`;

                    // Tutup modal konfirmasi
                    hideModal();

                    // Buka WhatsApp di tab baru
                    window.open(whatsappUrl, '_blank');

                    // Jika dalam modal Elementor, tutup modal Elementor
                    if (window.location.hash === '#convert') {
                        const elementorModal = jQuery('.dialog-close-button');
                        if (elementorModal.length) {
                            elementorModal.trigger('click');
                        }
                    }
                });

                modal.find('.modal-button.cancel').on('click', hideModal);

                // Close modal when clicking outside
                $(document).on('click', '.whatsapp-modal', function(e) {
                    if ($(e.target).is('.whatsapp-modal')) {
                        hideModal();
                    }
                });

                // Add input validation
                form.find('input, select').on('input change', function() {
                    $(this).toggleClass('is-valid', this.checkValidity());
                });

                // Currency formatter
                function formatCurrency(number) {
                    return new Intl.NumberFormat('id-ID', {
                        style: 'currency',
                        currency: 'IDR',
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 0
                    }).format(number);
                }

                // Update fungsi hideModal
                function hideModal() {
                    modal.removeClass('show');
                    modal.hide();
                    $('body').removeClass('modal-open');
                }

                // Validasi nominal
                const nominalInput = form.find('[name="nominal"]');
                nominalInput.on('input', function() {
                    const provider = form.find('input[name="provider"]:checked');
                    if (provider.length) {
                        const min = parseInt(provider.data('min'));
                        const max = parseInt(provider.data('max'));
                        const value = parseInt(this.value || 0);

                        let isValid = true;
                        let message = '';

                        if (value < min) {
                            isValid = false;
                            message = `Minimal nominal adalah ${formatCurrency(min)}`;
                        } else if (max && value > max) {
                            isValid = false;
                            message = `Maksimal nominal adalah ${formatCurrency(max)}`;
                        }

                        $(this).toggleClass('is-invalid', !isValid);
                        let feedback = $(this).siblings('.invalid-feedback');
                        if (!feedback.length) {
                            feedback = $('<div class="invalid-feedback"></div>').insertAfter(this);
                        }
                        feedback.text(message);

                        // Update price range info
                        const priceRange = $(this).siblings('.price-range');
                        priceRange.text(`Range: ${formatCurrency(min)} - ${max ? formatCurrency(max) : '∞'}`);
                    }
                });

                // Update provider change handler
                form.find('input[name="provider"]').on('change', function() {
                    const min = parseInt($(this).data('min'));
                    const max = parseInt($(this).data('max'));
                    const priceRange = nominalInput.siblings('.price-range');
                    priceRange.text(`Range: ${formatCurrency(min)} - ${max ? formatCurrency(max) : '∞'}`);

                    // Trigger nominal validation
                    nominalInput.trigger('input');
                });
            });
        </script>
